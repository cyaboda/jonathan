<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080807">
<meta name="description" content="Convocatoria oficial para celebrar los 30 años de Jonathan Sampedro">
<title>THE GOAT | Jonathan Sampedro · 30</title>
<style>
:root{color-scheme:dark;--gold:#e7c889;--gold-soft:#cda969;--bg:#080807;--white:#fff7e9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:white}body{overflow:hidden}button{font:inherit}
.screen{position:relative;height:100vh;height:100dvh;min-height:0;display:flex;align-items:flex-end;justify-content:center;isolation:isolate;overflow:hidden}
.screen::before{content:"";position:absolute;inset:0;z-index:-2;background:url('./FONDO%20I.webp') center center/cover no-repeat;animation:arrive 1.8s ease-out both}
.screen::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.10) 0%,transparent 38%,rgba(0,0,0,.3) 58%,rgba(0,0,0,.88) 100%)}
.content{width:min(92%,440px);padding:0 0 max(6vh,env(safe-area-inset-bottom) + 22px);text-align:center;animation:rise 1.2s .25s both}
.eyebrow{font:500 10px/1.5 Arial,sans-serif;letter-spacing:.36em;color:#e9d4a9;text-transform:uppercase}.guest{font-size:clamp(29px,8vw,47px);line-height:1.05;letter-spacing:.035em;margin:13px 0 14px;color:#f4d9a0;text-shadow:0 2px 18px #000;overflow-wrap:anywhere}
.rule{width:52px;height:1px;margin:0 auto 17px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}.called{font:400 clamp(11px,2.9vw,14px)/1.5 Arial,sans-serif;letter-spacing:.35em;margin:0 0 25px;color:#f8f0e3}
.open,.confirm{border:1px solid #d8ae63;background:linear-gradient(110deg,rgba(20,15,10,.94),rgba(72,49,20,.91));color:#f5dca9;min-height:57px;width:100%;max-width:345px;border-radius:100px;font:600 12px Arial,sans-serif;letter-spacing:.13em;cursor:pointer;box-shadow:0 0 22px #b98a4233,inset 0 0 12px #d6a75b18;transition:transform .2s,box-shadow .2s;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.open:hover,.confirm:hover{transform:translateY(-2px);box-shadow:0 0 28px #b98a4266}.open:focus-visible,.confirm:focus-visible,.back:focus-visible{outline:2px solid white;outline-offset:4px}.arrow{font-size:20px;line-height:1}.hint{font:400 10px Arial,sans-serif;letter-spacing:.18em;color:#b9aa90;margin-top:18px}
/* Pantalla 2: retratos despejados y contenido compacto en la mitad inferior */
.second{position:absolute;inset:0;z-index:2;display:flex;align-items:flex-end;justify-content:center;isolation:isolate;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .65s ease,visibility .65s ease}
.second::before{content:"";position:absolute;inset:0;z-index:-2;background:url('./FONDO%20II.webp') center top/cover no-repeat;transform:scale(1.035);transition:transform 1.5s ease}
.second::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 0%,transparent 34%,rgba(0,0,0,.18) 43%,rgba(0,0,0,.64) 55%,rgba(0,0,0,.82) 78%,rgba(0,0,0,.88) 100%)}
.second.visible{opacity:1;visibility:visible;pointer-events:auto}.second.visible::before{transform:scale(1)}
.invitation{width:min(90%,430px);height:55%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:0 0 max(18px,env(safe-area-inset-bottom) + 10px);gap:clamp(5px,.85dvh,9px);overflow-y:auto;scrollbar-width:none}
.invitation::-webkit-scrollbar{display:none}
.invitation .eyebrow{font-size:clamp(9px,1.15dvh,11px);letter-spacing:.29em;text-shadow:0 2px 12px #000}
.age-line{display:flex;align-items:baseline;justify-content:center;gap:clamp(15px,3vw,23px);margin-bottom:clamp(15px,2.2dvh,24px);color:#f2d69d;text-shadow:0 3px 20px #000}
.age{font-size:clamp(56px,10dvh,89px);line-height:.82;font-weight:600;letter-spacing:-.065em}.years{font:600 clamp(12px,1.9dvh,17px)/1 Arial,sans-serif;letter-spacing:.23em}
.celebrant{font-size:clamp(23px,4dvh,35px);line-height:1.05;letter-spacing:.045em;color:#fff7e9;margin:0 0 clamp(6px,1dvh,11px);text-shadow:0 2px 16px #000}
.motto{font:400 clamp(10px,1.45dvh,12px)/1.45 Arial,sans-serif;letter-spacing:.08em;color:#ead8b5;margin:0;max-width:330px}
.details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;border-top:1px solid #d9b8795c;border-bottom:1px solid #d9b8795c;padding:clamp(9px,1.35dvh,15px) 0;margin:2px 0}
.detail{padding:0 4px;min-width:0}.detail+.detail{border-left:1px solid #d9b8793b}
.detail-label{display:block;font:600 10px/1.3 Arial,sans-serif;letter-spacing:.13em;color:var(--gold);margin-bottom:5px}.detail-value{display:block;font:400 clamp(10px,1.4dvh,12px)/1.35 Arial,sans-serif;color:white;overflow-wrap:anywhere}
.confirm{max-width:350px;min-height:clamp(45px,6dvh,56px);background:linear-gradient(115deg,#efd49a,#c99e56);color:#211708;border-color:#f1d9a9;box-shadow:0 3px 28px #0008;font-size:11px;flex-shrink:0}
.confirm svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.confirmation-note{font:400 11px/1.4 Arial,sans-serif;color:#f5ddb0;margin:0;min-height:0}
.confirmation-note:empty{display:none}
.back{margin:0 auto;display:block;border:0;background:transparent;color:#d4c4a6;font:400 10px Arial,sans-serif;letter-spacing:.1em;cursor:pointer;padding:5px 12px}
@media(max-height:760px){.content{padding-bottom:18px}.guest{margin:8px 0}.called{margin-bottom:15px}.hint{margin-top:12px}.invitation{height:57%;gap:5px;padding-bottom:8px}.age-line{margin-bottom:12px}.celebrant{margin-bottom:5px}.age{font-size:clamp(50px,9dvh,70px)}.celebrant{font-size:clamp(22px,3.7dvh,30px)}.details{padding:7px 0}.confirm{min-height:44px}.back{padding:3px 10px}}
@media(max-height:570px){.invitation{height:63%;gap:3px}.age-line{margin-bottom:7px}.celebrant{margin-bottom:3px}.age{font-size:46px}.celebrant{font-size:22px}.motto{font-size:10px}.details{padding:5px 0}.confirm{min-height:40px}}
@media(min-width:700px){.screen::before{background-position:center 38%}.second::before{background-position:center 25%}.invitation{height:53%;padding-bottom:4vh}}
@keyframes arrive{from{transform:scale(1.08);filter:brightness(.6)}to{transform:scale(1);filter:brightness(1)}}@keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
@media(max-height:760px){.content{padding-bottom:18px}.guest{margin:8px 0}.called{margin-bottom:15px}.hint{margin-top:12px}.invitation{padding-bottom:8px}.age{font-size:clamp(52px,13vh,78px)}.years{margin:0}.celebrant{font-size:clamp(22px,5.7vw,30px)}.motto{margin-bottom:0}.message{margin-bottom:10px}.details{padding:9px 0;margin-bottom:0}.confirm{min-height:47px}.back{margin-top:5px}}
@media(max-height:570px){.second{align-items:center}.invitation{max-height:100%;padding:8px 0}.age{font-size:47px}.years,.motto{margin-bottom:0}.details{padding:6px 0;margin-bottom:0}.detail-label{margin-bottom:3px}.confirmation-note{margin-top:5px}.back{padding:4px}}
@media(min-width:700px){.screen::before{background-position:center 38%}.second::before{background-position:center 25%}.invitation{padding-bottom:5vh}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="screen" aria-label="Convocatoria de cumpleaños">
<section class="content" id="cover">
<div class="eyebrow">THE GOAT</div>
<h1 class="guest" id="guest">INVITADO CELEA</h1>
<div class="rule"></div>
<p class="called">ESTÁS CONVOCADO</p>
<button class="open" id="open" type="button">ABRIR CONVOCATORIA <span class="arrow" aria-hidden="true">→</span></button>
<div class="hint">JONATHAN SAMPEDRO · TEMPORADA 30</div>
</section>
<section class="second" id="second" aria-hidden="true" aria-label="Invitación oficial">
<div class="invitation">
<div class="eyebrow">CONVOCATORIA OFICIAL</div>
<div class="age-line"><span class="age">30</span><span class="years">AÑOS</span></div>
<h2 class="celebrant">JONATHAN SAMPEDRO</h2>
<p class="motto">LAS LEYENDAS NO CUMPLEN AÑOS.<br>SUMAN TEMPORADAS.</p>
<div class="details" aria-label="Detalles del evento">
<div class="detail"><span class="detail-label">FECHA</span><span class="detail-value" id="eventDate">Por confirmar</span></div>
<div class="detail"><span class="detail-label">HORA</span><span class="detail-value" id="eventTime">Por confirmar</span></div>
<div class="detail"><span class="detail-label">LUGAR</span><span class="detail-value" id="eventPlace">Por confirmar</span></div>
</div>
<button class="confirm" id="confirm" type="button">CONFIRMAR FICHAJE <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg></button>
<p class="confirmation-note" id="confirmationNote" role="status" aria-live="polite"></p>
<button class="back" id="back" type="button">← VOLVER A LA PORTADA</button>
</div>
</section>
</main>
<audio id="openingAudio" preload="auto" src="./AUDIO.wav" aria-hidden="true"></audio>
<script>
'use strict';
// PERSONALIZACIÓN: sustituye estos valores cuando tengas los datos reales.
const EVENT={date:'Por confirmar',time:'Por confirmar',place:'Por confirmar'};
const params=new URLSearchParams(window.location.search);
const raw=params.get('invitado')||params.get('nombre')||'Invitado Celea';
const guestName=(raw.trim().slice(0,70)||'Invitado Celea').toLocaleUpperCase('es');
document.querySelector('#guest').textContent=guestName;
document.querySelector('#eventDate').textContent=EVENT.date;
document.querySelector('#eventTime').textContent=EVENT.time;
document.querySelector('#eventPlace').textContent=EVENT.place;
const second=document.querySelector('#second');
const cover=document.querySelector('#cover');
const openingAudio=document.querySelector('#openingAudio');
const openButton=document.querySelector('#open');
const backButton=document.querySelector('#back');
const confirmButton=document.querySelector('#confirm');
let audioPlayed=false;
openButton.addEventListener('click',()=>{
  if(!audioPlayed){
    audioPlayed=true;
    openingAudio.loop=false;
    openingAudio.currentTime=0;
    const playback=openingAudio.play();
    if(playback&&typeof playback.catch==='function')playback.catch(()=>{});
  }
  second.classList.add('visible');
  second.setAttribute('aria-hidden','false');
  cover.setAttribute('inert','');
  backButton.focus({preventScroll:true});
});
backButton.addEventListener('click',()=>{
  second.classList.remove('visible');
  second.setAttribute('aria-hidden','true');
  cover.removeAttribute('inert');
  openButton.focus({preventScroll:true});
});
confirmButton.addEventListener('click',()=>{
  // Futuro: consultar la invitación y registrar el RSVP en Supabase.
  // No se envían datos ni se registra una confirmación en esta versión.
  document.querySelector('#confirmationNote').textContent='El registro de fichajes estará disponible próximamente.';
});
</script>
</body>
</html>
