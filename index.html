<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080807"><title>Convocatoria | Alexander 30</title>
<style>
:root{color-scheme:dark;--gold:#e7c889;--bg:#080807}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:white}body{overflow:hidden}.screen{position:relative;height:100vh;height:100dvh;min-height:480px;display:flex;align-items:flex-end;justify-content:center;isolation:isolate;overflow:hidden}.screen::before{content:"";position:absolute;inset:0;z-index:-2;background-image:url('./FONDO%20I.webp');background-position:center center;background-size:cover;background-repeat:no-repeat;animation:arrive 1.8s ease-out both}.screen::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.12) 0%,transparent 40%,rgba(0,0,0,.28) 57%,rgba(0,0,0,.86) 100%)}.content{width:min(92%,440px);padding:0 0 max(6vh,env(safe-area-inset-bottom) + 22px);text-align:center;animation:rise 1.2s .25s both}.eyebrow{font:500 10px/1.5 Arial,sans-serif;letter-spacing:.42em;color:#e9d4a9;text-transform:uppercase}.guest{font-size:clamp(30px,8vw,47px);line-height:1.05;letter-spacing:.035em;margin:13px 0 14px;color:#f4d9a0;text-shadow:0 2px 18px #000;overflow-wrap:anywhere}.rule{width:52px;height:1px;margin:0 auto 17px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}.called{font:400 clamp(11px,2.9vw,14px)/1.5 Arial,sans-serif;letter-spacing:.35em;margin:0 0 25px;color:#f8f0e3}.open{border:1px solid #d8ae63;background:linear-gradient(110deg,rgba(20,15,10,.85),rgba(72,49,20,.8));color:#f5dca9;min-height:57px;width:100%;max-width:345px;border-radius:100px;font:500 12px Arial,sans-serif;letter-spacing:.16em;cursor:pointer;box-shadow:0 0 22px #b98a4233,inset 0 0 12px #d6a75b18;transition:transform .2s,box-shadow .2s}.open:hover{transform:translateY(-2px);box-shadow:0 0 28px #b98a4266}.open:focus-visible{outline:2px solid white;outline-offset:4px}.open span{font-size:19px;vertical-align:-2px;margin-left:10px}.hint{font:400 10px Arial,sans-serif;letter-spacing:.18em;color:#b9aa90;margin-top:18px}.second{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 35%,#342714,#080807 70%);text-align:center;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s}.second.visible{opacity:1;visibility:visible}.second h1{font-size:clamp(38px,10vw,64px);color:var(--gold);margin:14px 0}.second p{font:14px/1.7 Arial,sans-serif;color:#e8dac0}.back{margin-top:25px;background:transparent;border:1px solid #a78b58;border-radius:30px;color:var(--gold);padding:12px 25px;cursor:pointer}@keyframes arrive{from{transform:scale(1.08);filter:brightness(.6)}to{transform:scale(1);filter:brightness(1)}}@keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}@media(max-height:680px){.content{padding-bottom:20px}.guest{margin:8px 0}.called{margin-bottom:15px}.hint{margin-top:12px}}@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style></head><body>
<main class="screen" aria-label="Portada de la convocatoria">
<section class="content" id="cover"><div class="eyebrow">The Goat</div><h1 class="guest" id="guest">INVITADO</h1><div class="rule"></div><p class="called">ESTÁS CONVOCADO</p><button class="open" id="open" type="button">ABRIR CONVOCATORIA <span aria-hidden="true">→</span></button><div class="hint">JONATHAN · TEMPORADA 30</div></section>
<section class="second" id="second" aria-hidden="true"><div><div class="eyebrow">Convocatoria oficial</div><h1>30 AÑOS</h1><p>Alexander Mendoza<br>Próximamente: detalles del gran partido.</p><button class="back" id="back" type="button">Volver a la portada</button></div></section>
</main><script>
const params=new URLSearchParams(location.search);const raw=params.get('invitado')||params.get('nombre')||'Carlos Pérez';const name=raw.trim().slice(0,70);if(name)document.querySelector('#guest').textContent=name.toLocaleUpperCase('es');const second=document.querySelector('#second');document.querySelector('#open').addEventListener('click',()=>{second.classList.add('visible');second.setAttribute('aria-hidden','false');document.querySelector('#back').focus()});document.querySelector('#back').addEventListener('click',()=>{second.classList.remove('visible');second.setAttribute('aria-hidden','true');document.querySelector('#open').focus()});
</script></body></html>
